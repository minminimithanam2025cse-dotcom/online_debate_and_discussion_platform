{% extends 'base.html' %}
{% block title %}404 — Page Not Found — DebateSphere{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow-sm form-card">
            <div class="display-1 fw-bold text-primary mb-2">404</div>
            <h3 class="fw-bold mb-2">Motion Not Found</h3>
            <p class="text-muted mb-4">The debate topic or page you were looking for doesn't exist, has been concluded, or was relocated.</p>
            <div>
                <a href="{% url 'topic_list' %}" class="btn btn-primary px-4">
                    <i class="fa-solid fa-arrow-left me-1"></i> Return to Debates
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
