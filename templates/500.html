{% extends 'base.html' %}
{% block title %}500 — Server Error — DebateSphere{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow-sm form-card">
            <div class="display-1 fw-bold text-danger mb-2">500</div>
            <h3 class="fw-bold mb-2">Internal Arena Error</h3>
            <p class="text-muted mb-4">Something went wrong while processing the debate motion. Our moderators have been notified.</p>
            <div>
                <a href="{% url 'topic_list' %}" class="btn btn-primary px-4">
                    <i class="fa-solid fa-house me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
