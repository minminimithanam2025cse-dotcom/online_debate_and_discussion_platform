{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="card form-card p-4">
    <h2 class="fw-bold mb-3">Edit profile</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors|join:' ' }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save profile</button>
        <a href="{% url 'user_profile' user.username %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
