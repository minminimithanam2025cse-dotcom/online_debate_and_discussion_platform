{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card form-card p-4">
    <h2 class="fw-bold mb-3">Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
        <a href="{% url 'signup' %}" class="btn btn-outline-secondary">Create account</a>
    </form>
</div>
{% endblock %}
