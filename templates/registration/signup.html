{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="card form-card p-4">
    <h2 class="fw-bold mb-3">Create an account</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors|join:' ' }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Sign Up</button>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary">Already have an account?</a>
    </form>
</div>
{% endblock %}
